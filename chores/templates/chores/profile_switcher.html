{% extends "chores/base.html" %}

{% block title %}Who's using this?{% endblock %}

{% block content %}
<h1>Who's using this?</h1>
<div style="display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center;">
    {% for profile in profiles %}
    <a href="{% url 'select_profile' profile.id %}"
       style="text-decoration: none; color: inherit;">
        <div style="text-align: center;">
            <div style="width: 80px; height: 80px; border-radius: 50%; background: {{ profile.color }};
                        display: flex; align-items: center; justify-content: center;
                        color: white; font-size: 1.5rem; font-weight: bold; margin: 0 auto;">
                {{ profile.name|first }}
            </div>
            <p style="margin-top: 0.5rem; font-weight: 500;">{{ profile.name }}</p>
        </div>
    </a>
    {% endfor %}
</div>
{% endblock %}
