{% extends "chores/base.html" %}

{% block title %}New task{% endblock %}

{% block content %}
<h1>New task</h1>
<form method="post">
    {% csrf_token %}
    <table style="width: 100%;">
        {{ form.as_table }}
    </table>
    <p style="text-align: center;">
        <button type="submit">Create task</button>
    </p>
</form>
<p style="text-align: center;">
    <a href="{% url 'task_list' %}">Back to tasks</a>
</p>
{% endblock %}
