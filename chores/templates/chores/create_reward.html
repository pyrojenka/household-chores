{% extends "chores/base.html" %}

{% block title %}New reward{% endblock %}

{% block content %}
<h1>New reward</h1>
<form method="post">
    {% csrf_token %}
    <table style="width: 100%;">
        {{ form.as_table }}
    </table>
    <p style="text-align: center;">
        <button type="submit">Add reward</button>
    </p>
</form>
<p style="text-align: center;">
    <a href="{% url 'reward_catalog' %}">Back to rewards</a>
</p>
{% endblock %}
